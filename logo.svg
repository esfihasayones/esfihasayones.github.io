<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 140" width="470" height="140" role="img" aria-label="Esfihas Sayones">
  <title>Esfihas Sayones</title>
  <defs>
    <linearGradient id="massa" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#F5CB86"/>
      <stop offset="1" stop-color="#DB963A"/>
    </linearGradient>
    <linearGradient id="casca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF4E7"/>
      <stop offset="1" stop-color="#F3E5CE"/>
    </linearGradient>
  </defs>

  <!-- selo -->
  <circle cx="70" cy="70" r="58" fill="url(#casca)" stroke="#B54A2A" stroke-width="4"/>
  <circle cx="70" cy="70" r="49" fill="none" stroke="#B54A2A" stroke-width="2.6"
          stroke-linecap="round" stroke-dasharray="0.5 8.5" opacity="0.75"/>

  <!-- esfiha fechada (triangular) -->
  <path d="M70 44 L96 88 L44 88 Z" fill="url(#massa)" stroke="#DB963A"
        stroke-width="11" stroke-linejoin="round"/>
  <path d="M70 44 L96 88 L44 88 Z" fill="none" stroke="#B87430"
        stroke-width="2" stroke-linejoin="round" opacity="0.45"/>

  <!-- costuras da dobra -->
  <g stroke="#A8431F" stroke-width="4.6" stroke-linecap="round" opacity="0.85">
    <line x1="70" y1="72" x2="70" y2="50"/>
    <line x1="70" y1="72" x2="88" y2="83"/>
    <line x1="70" y1="72" x2="52" y2="83"/>
  </g>
  <circle cx="70" cy="72" r="4.2" fill="#8E3418"/>

  <!-- vapor -->
  <g stroke="#B54A2A" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M58 36 q5 -6 0 -12"/>
    <path d="M70 32 q5 -7 0 -14"/>
    <path d="M82 36 q5 -6 0 -12"/>
  </g>

  <!-- wordmark -->
  <text x="152" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="20"
        font-weight="600" letter-spacing="14" fill="#B54A2A">ESFIHAS</text>
  <text x="150" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="47"
        font-weight="700" letter-spacing="1.5" fill="#2E211A">SAYONES</text>
  <line x1="152" y1="112" x2="392" y2="112" stroke="#DB963A" stroke-width="2.4" stroke-linecap="round"/>
  <text x="152" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="11"
        letter-spacing="2.2" fill="#6B4A33">FLORIAN&#211;POLIS &#183; FEITO EM CASA</text>
</svg>
